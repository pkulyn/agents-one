<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
  <title id="title">Agents One 彩虹圆环标识方案</title>
  <desc id="description">四个白底圆角方形和彩虹圆环组成的 Agents One 标识方向。</desc>
  <defs>
    <linearGradient id="spectrum-a" x1="42" y1="48" x2="214" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1088F8"/><stop offset=".18" stop-color="#6259E9"/><stop offset=".36" stop-color="#C64DCD"/><stop offset=".53" stop-color="#F05C87"/><stop offset=".69" stop-color="#F3A238"/><stop offset=".84" stop-color="#29BE9B"/><stop offset="1" stop-color="#1088F8"/>
    </linearGradient>
    <linearGradient id="spectrum-b" x1="42" y1="48" x2="214" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36A8FF"/><stop offset=".2" stop-color="#786BF3"/><stop offset=".42" stop-color="#E06AE0"/><stop offset=".58" stop-color="#FF86A7"/><stop offset=".74" stop-color="#FFC15E"/><stop offset=".9" stop-color="#42D6B2"/><stop offset="1" stop-color="#36A8FF"/>
    </linearGradient>
    <linearGradient id="spectrum-c" x1="42" y1="48" x2="214" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B80EE"/><stop offset=".18" stop-color="#5F4CD9"/><stop offset=".37" stop-color="#B944C6"/><stop offset=".55" stop-color="#EB5F7F"/><stop offset=".7" stop-color="#F29B31"/><stop offset=".86" stop-color="#22B88E"/><stop offset="1" stop-color="#0B80EE"/>
    </linearGradient>
    <linearGradient id="spectrum-d1" x1="128" y1="58" x2="198" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1088F8"/><stop offset=".35" stop-color="#7658EC"/><stop offset=".7" stop-color="#D24CCB"/><stop offset="1" stop-color="#F0638A"/>
    </linearGradient>
    <linearGradient id="spectrum-d2" x1="128" y1="198" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F18D3A"/><stop offset=".38" stop-color="#E9AE40"/><stop offset=".72" stop-color="#38C5A4"/><stop offset="1" stop-color="#1088F8"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#34445b" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="1080" fill="#F8FAFC"/>
  <text x="100" y="104" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="48" font-weight="800">Agents One 标识方向</text>
  <text x="100" y="154" fill="#697386" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="24">白底圆角方形 · 彩虹渐变 O · 适配桌面、任务栏与应用内</text>

  <g transform="translate(100 220)">
    <rect width="620" height="340" rx="32" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
    <g transform="translate(52 42)" filter="url(#shadow)">
      <rect width="256" height="256" rx="58" fill="#fff" stroke="#E4E8F0" stroke-width="4"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#EEF1F6" stroke-width="32"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="url(#spectrum-a)" stroke-width="32"/>
    </g>
    <text x="356" y="104" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800">A · 连续光谱</text>
    <text x="356" y="150" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">最纯粹的 O</text>
    <text x="356" y="190" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">辨识度最高，16px 也清楚</text>
    <rect x="356" y="230" width="112" height="36" rx="18" fill="#EEF5FF"/>
    <text x="380" y="254" fill="#1768B3" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700">推荐</text>
  </g>

  <g transform="translate(880 220)">
    <rect width="620" height="340" rx="32" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
    <g transform="translate(52 42)" filter="url(#shadow)">
      <rect width="256" height="256" rx="58" fill="#fff" stroke="#E4E8F0" stroke-width="4"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#EEF1F6" stroke-width="32"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="url(#spectrum-b)" stroke-width="32"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="54 386" stroke-dashoffset="-56" opacity=".62"/>
    </g>
    <text x="356" y="104" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800">B · 柔光光环</text>
    <text x="356" y="150" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">在 O 上加入一束柔和高光</text>
    <text x="356" y="190" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">更精致，但小尺寸略弱于 A</text>
  </g>

  <g transform="translate(100 650)">
    <rect width="620" height="340" rx="32" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
    <g transform="translate(52 42)" filter="url(#shadow)">
      <rect width="256" height="256" rx="58" fill="#fff" stroke="#E4E8F0" stroke-width="4"/>
      <circle cx="128" cy="128" r="75" fill="none" stroke="#EFF2F7" stroke-width="9"/>
      <circle cx="128" cy="128" r="62" fill="none" stroke="#EEF1F6" stroke-width="26"/>
      <circle cx="128" cy="128" r="62" fill="none" stroke="url(#spectrum-c)" stroke-width="26"/>
      <circle cx="128" cy="128" r="75" fill="none" stroke="url(#spectrum-c)" stroke-width="8" opacity=".3"/>
    </g>
    <text x="356" y="104" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800">C · 协作同心</text>
    <text x="356" y="150" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">内外两层象征协作与聚合</text>
    <text x="356" y="190" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">理念强，适合大尺寸欢迎页</text>
  </g>

  <g transform="translate(880 650)">
    <rect width="620" height="340" rx="32" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
    <g transform="translate(52 42)" filter="url(#shadow)">
      <rect width="256" height="256" rx="58" fill="#fff" stroke="#E4E8F0" stroke-width="4"/>
      <circle cx="128" cy="128" r="69" fill="none" stroke="#EEF1F6" stroke-width="31"/>
      <path d="M128 59a69 69 0 0 1 0 138" fill="none" stroke="url(#spectrum-d1)" stroke-width="31" stroke-linecap="round"/>
      <path d="M128 197a69 69 0 0 1 0-138" fill="none" stroke="url(#spectrum-d2)" stroke-width="31" stroke-linecap="round"/>
    </g>
    <text x="356" y="104" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800">D · 交汇轨道</text>
    <text x="356" y="150" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">两条轨迹在同一个 O 内相遇</text>
    <text x="356" y="190" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">协作感更强，风格更有个性</text>
  </g>
</svg>
