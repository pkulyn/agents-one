<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 920" role="img" aria-labelledby="title description">
  <title id="title">Agents One 曙光 O 标识方案</title>
  <desc id="description">三种收敛色彩的 Agents One 圆环标识：曙光 O、地平线 O、光迹 O。</desc>
  <defs>
    <linearGradient id="dawn" x1="46" y1="44" x2="214" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C92F5"/>
      <stop offset=".32" stop-color="#7064E8"/>
      <stop offset=".58" stop-color="#D976AA"/>
      <stop offset=".82" stop-color="#FFC46A"/>
      <stop offset="1" stop-color="#2C92F5"/>
    </linearGradient>
    <linearGradient id="horizon" x1="48" y1="48" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2695F8"/>
      <stop offset=".46" stop-color="#7290F4"/>
      <stop offset="1" stop-color="#FFC66C"/>
    </linearGradient>
    <linearGradient id="trail" x1="46" y1="44" x2="214" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C92F5"/>
      <stop offset=".33" stop-color="#7064E8"/>
      <stop offset=".59" stop-color="#D976AA"/>
      <stop offset=".83" stop-color="#FFC46A"/>
      <stop offset="1" stop-color="#2C92F5"/>
    </linearGradient>
    <linearGradient id="trail-mini" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C92F5"/>
      <stop offset=".33" stop-color="#7064E8"/>
      <stop offset=".59" stop-color="#D976AA"/>
      <stop offset=".83" stop-color="#FFC46A"/>
      <stop offset="1" stop-color="#2C92F5"/>
    </linearGradient>
    <filter id="tile-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#28374E" flood-opacity=".14"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#2B3850" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1680" height="920" fill="#F7F9FC"/>
  <text x="104" y="104" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="48" font-weight="800">Agents One · 曙光 O</text>
  <text x="104" y="154" fill="#697386" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="24">以完整 O 代表 One；色彩从冷静的现在，走向明亮的未来。</text>

  <!-- A: Dawn O -->
  <g transform="translate(104 236)">
    <rect width="456" height="584" rx="32" fill="#fff" stroke="#E1E7F0" stroke-width="2"/>
    <g transform="translate(100 48)" filter="url(#tile-shadow)">
      <rect width="256" height="256" rx="58" fill="#fff" stroke="#E3E8F1" stroke-width="4"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#EDF1F6" stroke-width="31"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="url(#dawn)" stroke-width="31"/>
    </g>
    <text x="36" y="370" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800">A · 曙光 O</text>
    <text x="36" y="416" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">蓝紫为主，粉金像远处升起的光。</text>
    <text x="36" y="456" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">适合主标识，也是最均衡的一稿。</text>
    <rect x="36" y="502" width="114" height="36" rx="18" fill="#EEF5FF"/>
    <text x="60" y="526" fill="#1768B3" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700">主推</text>
  </g>

  <!-- B: Horizon O -->
  <g transform="translate(612 236)">
    <rect width="456" height="584" rx="32" fill="#fff" stroke="#E1E7F0" stroke-width="2"/>
    <g transform="translate(100 48)" filter="url(#tile-shadow)">
      <rect width="256" height="256" rx="58" fill="#fff" stroke="#E3E8F1" stroke-width="4"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#EDF1F6" stroke-width="31"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="url(#horizon)" stroke-width="31"/>
    </g>
    <text x="36" y="370" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800">B · 地平线 O</text>
    <text x="36" y="416" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">从冷蓝自然过渡到日出金。</text>
    <text x="36" y="456" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">最克制，适合长期桌面使用。</text>
  </g>

  <!-- C: Light-trail O -->
  <g transform="translate(1120 236)">
    <rect width="456" height="584" rx="32" fill="#fff" stroke="#E1E7F0" stroke-width="2"/>
    <g transform="translate(100 48)" filter="url(#tile-shadow)">
      <rect width="256" height="256" rx="58" fill="#fff" stroke="#E3E8F1" stroke-width="4"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#EDF1F6" stroke-width="31"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="url(#trail)" stroke-width="31"/>
      <circle cx="128" cy="128" r="70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="46 394" stroke-dashoffset="-246" opacity=".76"/>
    </g>
    <text x="36" y="370" fill="#171A21" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="30" font-weight="800">C · 光迹 O</text>
    <text x="36" y="416" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">曙光 O 加一段轻微流动高光。</text>
    <text x="36" y="456" fill="#526072" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="21">最适合作为“正在思考”的动态环。</text>
    <g transform="translate(36 500)" filter="url(#soft-shadow)">
      <circle cx="20" cy="20" r="15" fill="none" stroke="#EDF1F6" stroke-width="7"/>
      <circle cx="20" cy="20" r="15" fill="none" stroke="url(#trail-mini)" stroke-width="7"/>
      <circle cx="20" cy="20" r="15" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="10 84" stroke-dashoffset="-50" opacity=".8"/>
    </g>
    <text x="84" y="527" fill="#697386" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="18">思考状态：高光沿环缓慢移动</text>
  </g>
</svg>
