appId: com.pkulyn.agents-one
productName: Agents One
directories:
  buildResources: build
# `npm run install:clean` installs and verifies this platform's Electron
# distribution. Reuse it instead of downloading and extracting a second copy
# during packaging, which can be blocked by real-time scanners on Windows.
electronDist: node_modules/electron/dist
afterPack: scripts/after-pack-windows-icon.mjs
files:
  # `out/` is ignored by Git, but it is the actual electron-vite runtime
  # entrypoint and must be explicitly included in local/CI packages. Without
  # this rule electron-builder can produce an Electron shell containing only
  # `default_app.asar`, which silently runs stale or empty application code.
  - out/**
  # The main bundle resolves the notification-area image from this directory.
  # Keep it explicit: `asarUnpack` only affects files already selected here.
  - resources/**
  # Git ignores do not constrain electron-builder. Explicitly exclude every
  # machine-local recovery, sandbox and cache surface so a package can never
  # absorb test credentials, browser state or dependency backups.
  - "!**/.sandbox/**"
  - "!**/.agents-one/**"
  - "!**/.cache/**"
  - "!**/.belt/**"
  - "!**/tmp/**"
  - "!**/dist/**"
  - "!**/release/**"
  - "!**/.agents-one-node_modules-interrupted-*/**"
  - "!**/node_modules.upstream-junction-backup-*/**"
  - "!**/*.log"
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/prebuilds/*.node
extraResources:
  - from: LICENSE
    to: notices/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: notices/THIRD_PARTY_NOTICES.md
  - from: assets/readme/OFL-Oxanium.txt
    to: notices/OFL-Oxanium.txt
win:
  executableName: agents-one
  icon: build/icon.ico
  # Keep helper unpacking optional for ordinary Windows users. The afterPack
  # hook embeds the brand icon with the locked JavaScript resource editor;
  # signing can be enabled separately in a dedicated signing environment.
  signAndEditExecutable: false
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  vendor: Agents One
  category: Utility
  synopsis: Self-improving AI assistant desktop app
  description: >-
    Agents One is a native desktop workspace for coordinating conversations,
    tasks, projects, and artifacts across multiple AI agents.
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: ${name}-${version}.${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
npmRebuild: false
publish:
  provider: github
  owner: pkulyn
  repo: agents-one
