name: Windows Alpha Release Gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full immutable 40-character commit SHA to validate"
        required: true
        type: string
      publish_draft:
        description: "Create a draft GitHub Release after the release environment approves"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish_draft:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-alpha-release-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AGENTS_ONE_REQUESTED_RELEASE_SHA: ${{ inputs.ref }}
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require an immutable commit SHA
        shell: pwsh
        run: |
          $requested = $env:AGENTS_ONE_REQUESTED_RELEASE_SHA.Trim()
          if ($requested -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'Release validation requires a full 40-character commit SHA; branch names, tags, and abbreviated SHAs are rejected.'
          }

      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Record immutable release identity
        id: identity
        shell: pwsh
        run: |
          $requested = $env:AGENTS_ONE_REQUESTED_RELEASE_SHA.Trim().ToLowerInvariant()
          $sha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -ne $requested) { throw "Checkout resolved to $sha instead of requested SHA $requested" }
          $version = node -p "require('./package.json').version"
          $lockHash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if (git status --porcelain) { throw "Checkout is not clean before validation" }
          $remoteTag = git ls-remote origin "refs/tags/v$version"
          if ($remoteTag) {
            $tagSha = ($remoteTag -split "\s+")[0]
            if ($tagSha -ne $sha) { throw "Tag v$version already points to $tagSha instead of $sha" }
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "AGENTS_ONE_RELEASE_SHA=$sha" >> $env:GITHUB_ENV
          "AGENTS_ONE_LOCK_SHA256=$lockHash" >> $env:GITHUB_ENV
          Write-Host "Commit: $sha"
          Write-Host "Version/tag: $version / v$version"
          Write-Host "package-lock.json SHA-256: $lockHash"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install verified dependencies
        run: npm run install:clean

      - name: Verify lockfile and worktree stayed immutable
        shell: pwsh
        run: |
          $lockHash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($lockHash -ne $env:AGENTS_ONE_LOCK_SHA256) { throw "package-lock.json changed during install" }
          if (git status --porcelain) { git status --short; throw "Install changed the tracked worktree" }

      - name: Run three consecutive automated gate rounds
        shell: pwsh
        run: |
          $commands = @(
            @{ Name = 'format'; Run = { npm run format:check } },
            @{ Name = 'typecheck'; Run = { npm run typecheck } },
            @{ Name = 'lint'; Run = { npm run lint -- --no-cache --quiet } },
            @{ Name = 'main and subproject tests'; Run = { npm run test:all } },
            @{ Name = 'dependency audit'; Run = { npm audit --audit-level=high } },
            @{ Name = 'production build'; Run = { npm run build } }
          )
          foreach ($round in 1..3) {
            Write-Host "::group::Automated release gate round $round of 3"
            foreach ($entry in $commands) {
              Write-Host "Running $($entry.Name)"
              & $entry.Run
              if ($LASTEXITCODE -ne 0) {
                Write-Host '::endgroup::'
                throw "Release gate round $round failed at $($entry.Name)"
              }
            }
            Write-Host '::endgroup::'
          }

      - name: Package unsigned Windows x64 installer and portable app
        run: npm run package:win

      - name: Smoke-test packaged application
        shell: pwsh
        run: ./scripts/windows-package-smoke.ps1 -DistDirectory dist -ExpectedVersion "${{ steps.identity.outputs.version }}"

      - name: Generate checksums and release notes
        shell: pwsh
        run: |
          $expectedNames = @(
            "agents-one-${{ steps.identity.outputs.version }}-setup.exe",
            "agents-one-${{ steps.identity.outputs.version }}-portable.exe",
            "agents-one-${{ steps.identity.outputs.version }}-setup.exe.blockmap",
            'latest.yml'
          )
          $releaseFiles = foreach ($name in $expectedNames) {
            $path = Join-Path dist $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected release file is missing: $name"
            }
            Get-Item -LiteralPath $path
          }
          $checksums = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          @(
            "# Agents One v${{ steps.identity.outputs.version }} (draft)"
            ""
            "- Commit SHA: ``$env:AGENTS_ONE_RELEASE_SHA``"
            "- Platform: Windows x64 only"
            "- Signing: unsigned Alpha; Windows SmartScreen may warn"
            "- Automatic updates: disabled; download manually and verify ``SHA256SUMS.txt``"
            "- Known limitations: macOS and Linux are not public release targets for this Alpha"
            "- Rollback: uninstall this build, reinstall the previously verified package, then restore an Agents One backup if data rollback is required"
          ) | Set-Content dist/RELEASE_NOTES.md -Encoding utf8

      - name: Upload immutable Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agents-one-${{ steps.identity.outputs.version }}-windows-x64-${{ steps.identity.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

  publish_draft:
    name: Create approved draft Release
    needs: gate
    if: inputs.publish_draft == true
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agents-one-${{ needs.gate.outputs.version }}-windows-x64-${{ needs.gate.outputs.sha }}
          path: artifacts

      - name: Create draft GitHub Release at the verified SHA
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          name: Agents One ${{ needs.gate.outputs.tag }} (Windows x64 Alpha)
          body_path: artifacts/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/SHA256SUMS.txt
