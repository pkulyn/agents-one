name: Windows Alpha Release Gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Immutable commit SHA or ref to validate"
        required: true
        default: "main"
        type: string
      publish_draft:
        description: "Create a draft GitHub Release after the release environment approves"
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish_draft:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-alpha-release-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Record immutable release identity
        id: identity
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $version = node -p "require('./package.json').version"
          $lockHash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if (git status --porcelain) { throw "Checkout is not clean before validation" }
          $remoteTag = git ls-remote origin "refs/tags/v$version"
          if ($remoteTag) {
            $tagSha = ($remoteTag -split "\s+")[0]
            if ($tagSha -ne $sha) { throw "Tag v$version already points to $tagSha instead of $sha" }
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "AGENTS_ONE_RELEASE_SHA=$sha" >> $env:GITHUB_ENV
          "AGENTS_ONE_LOCK_SHA256=$lockHash" >> $env:GITHUB_ENV
          Write-Host "Commit: $sha"
          Write-Host "Version/tag: $version / v$version"
          Write-Host "package-lock.json SHA-256: $lockHash"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install verified dependencies
        run: npm run install:clean

      - name: Verify lockfile and worktree stayed immutable
        shell: pwsh
        run: |
          $lockHash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($lockHash -ne $env:AGENTS_ONE_LOCK_SHA256) { throw "package-lock.json changed during install" }
          if (git status --porcelain) { git status --short; throw "Install changed the tracked worktree" }

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --no-cache --quiet

      - name: Test main project
        run: npm test

      - name: Test packaged conversation and configuration paths
        run: npm exec -- vitest run tests/runtime-conversation-store.test.ts tests/config-value-paths.test.ts tests/connection-config-security.test.ts

      - name: Test subprojects
        run: npm run test:subprojects

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Build production bundles
        run: npm run build

      - name: Package unsigned Windows x64 installer and portable app
        run: npm run package:win

      - name: Smoke-test packaged application
        shell: pwsh
        run: ./scripts/windows-package-smoke.ps1 -DistDirectory dist -ExpectedVersion "${{ steps.identity.outputs.version }}"

      - name: Generate checksums and release notes
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } | Sort-Object Name
          if (-not $releaseFiles) { throw "No release files found" }
          $checksums = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          @(
            "# Agents One v${{ steps.identity.outputs.version }} (draft)"
            ""
            "- Commit SHA: ``$env:AGENTS_ONE_RELEASE_SHA``"
            "- Platform: Windows x64 only"
            "- Signing: unsigned Alpha; Windows SmartScreen may warn"
            "- Automatic updates: disabled; download manually and verify ``SHA256SUMS.txt``"
            "- Known limitations: macOS and Linux are not public release targets for this Alpha"
            "- Rollback: uninstall this build, reinstall the previously verified package, then restore an Agents One backup if data rollback is required"
          ) | Set-Content dist/RELEASE_NOTES.md -Encoding utf8

      - name: Upload immutable Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: agents-one-${{ steps.identity.outputs.version }}-windows-x64-${{ steps.identity.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

  publish_draft:
    name: Create approved draft Release
    needs: gate
    if: inputs.publish_draft == true
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@v4
        with:
          name: agents-one-${{ needs.gate.outputs.version }}-windows-x64-${{ needs.gate.outputs.sha }}
          path: artifacts

      - name: Create draft GitHub Release at the verified SHA
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: ${{ needs.gate.outputs.tag }}
          target_commitish: ${{ needs.gate.outputs.sha }}
          name: Agents One ${{ needs.gate.outputs.tag }} (Windows x64 Alpha)
          body_path: artifacts/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/SHA256SUMS.txt
