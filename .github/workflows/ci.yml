name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm run install:clean

      - name: Check public documentation scope
        run: npm run docs:check

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test subprojects
        run: npm run test:subprojects

      # Lint is a release gate. Formatting warnings are tracked separately,
      # while every ESLint error must block a merge.
      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Build
        run: npm run build
