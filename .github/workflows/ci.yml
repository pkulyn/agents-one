name: CI

# The required check always runs; only explicit documentation-only changes
# skip application gates. Unknown or unavailable comparisons use the full path.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Classify changed inputs
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $classifier = Join-Path $env:RUNNER_TEMP 'agents-one-base-classifier.mjs'
          if ($env:CI_BASE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            'docs_only=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $trusted = git show "${env:CI_BASE_SHA}:scripts/classify-ci-change.mjs"
          if ($LASTEXITCODE -ne 0) {
            'docs_only=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          [System.IO.File]::WriteAllText($classifier, ($trusted -join "`n"), [System.Text.UTF8Encoding]::new($false))
          node $classifier
          if ($LASTEXITCODE -ne 0) { throw 'CI classification failed' }

      - name: Test CI routing
        run: node --test scripts/classify-ci-change.test.mjs scripts/write-windows-release-identity.test.mjs

      - name: Install documentation tools
        if: steps.changes.outputs.docs_only == 'true'
        run: npm ci --ignore-scripts --no-audit

      - name: Install application dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run install:clean

      - name: Check public documentation scope
        run: npm run docs:check

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: npm test

      - name: Test subprojects
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:subprojects

      # Lint is a release gate. Formatting warnings are tracked separately,
      # while every ESLint error must block a merge.
      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Audit dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run audit:ci

      - name: Build
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build
