name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm run install:clean

      - name: Check public documentation scope
        run: npm run docs:check

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Test subprojects
        run: npm run test:subprojects

      # Lint is a release gate. Formatting warnings are tracked separately,
      # while every ESLint error must block a merge.
      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Build
        run: npm run build
