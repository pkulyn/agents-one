name: RC1 Windows Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Immutable commit SHA or ref to validate"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Reuse Windows Alpha release gate
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ inputs.ref }}
      publish_draft: false
