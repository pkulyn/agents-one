name: RC1 Windows Validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full immutable 40-character commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Reuse Windows Alpha release gate
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ inputs.ref }}
      publish_draft: false
