name: Feature request
description: Propose a focused product or developer-experience improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should Agents One solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior, not only a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: textarea
    id: boundaries
    attributes:
      label: Runtime, data, security, or compatibility impact
      description: Note affected runtimes, stored data, permissions, protocols, or operating systems.
