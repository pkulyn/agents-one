name: Bug report
description: Report a reproducible Agents One defect without private data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not submit credentials, private logs, personal data, or security vulnerabilities here. Use the private security channel for sensitive reports.
  - type: input
    id: version
    attributes:
      label: Agents One version or commit
      placeholder: v0.1.0-alpha.1 or full commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - macOS (development only)
        - Linux (development only)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest safe reproduction and redact local paths, tokens, and user content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste only the minimum reviewed and redacted output needed to diagnose the issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety confirmation
      options:
        - label: I reviewed this report and removed credentials, private user data, and sensitive local paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
